   <g id="text_14">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans', sans-serif; text-anchor: start; fill: #e34948" x="89.784" y="197.5815" transform="rotate(-0 89.784 197.5815)">genotyping does not validate a predicted effect</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans', sans-serif; text-anchor: start; fill: #0b0b0b" x="15.4584" y="16.415859" transform="rotate(-0 15.4584 16.415859)">Three evidence levels, kept separate</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7px; font-family: 'DejaVu Sans', sans-serif; text-anchor: start; fill: #52514e" x="15.4584" y="26.873906" transform="rotate(-0 15.4584 26.873906)">The in silico analysis was performed after the genotyping and did not guide the experimental design.</text>
   </g>
