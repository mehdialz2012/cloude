   <g id="text_1">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans', sans-serif; text-anchor: start; fill: #0b0b0b" x="29.9106" y="46.252687" transform="rotate(-0 29.9106 46.252687)">Level 1 - Computational regulatory prediction</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans', sans-serif; text-anchor: start; fill: #2a78d6" x="29.9106" y="57.411937" transform="rotate(-0 29.9106 57.411937)">THIS STUDY (retrospective, in silico)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(29.9106 69.206)">AlphaGenome 2; 16 conditions, 22 scorers,</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(29.9106 78.806)">4 variant configurations; GRCh38</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(223.983 59.431)">Establishes</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(223.983 68.411)">  predicted cis-regulatory consequence</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(223.983 78.631)">Does NOT establish</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(223.983 87.611)">  measured expression, phenotype, diagnosis</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans', sans-serif; text-anchor: start; fill: #0b0b0b" x="29.9106" y="132.877687" transform="rotate(-0 29.9106 132.877687)">Level 2 - Experimental genotype detection</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans', sans-serif; text-anchor: start; fill: #eb6834" x="29.9106" y="144.036937" transform="rotate(-0 29.9106 144.036937)">PRIOR STUDY (PCR + Sanger sequencing, n = 100)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(29.9106 155.831)">399 bp amplicon; 100% call rate;</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(29.9106 165.431)">Hardy-Weinberg equilibrium met in controls</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(223.983 146.056)">Establishes</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(223.983 155.036)">  the genotype at each position was read correctly</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(223.983 165.256)">Does NOT establish</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(223.983 174.236)">  any effect on gene regulation</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans', sans-serif; text-anchor: start; fill: #0b0b0b" x="29.9106" y="219.502687" transform="rotate(-0 29.9106 219.502687)">Level 3 - Statistical phenotype association</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans', sans-serif; text-anchor: start; fill: #1baf7a" x="29.9106" y="230.661937" transform="rotate(-0 29.9106 230.661937)">PRIOR STUDY (case-control, n = 100, 6-CIT groups)</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(29.9106 242.7495)">No association survived FDR correction;</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(29.9106 252.056)">rs2922126 achieved power 6.62%; rs115459563</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(29.9106 261.656)">models did not converge; rs34136054 n = 1</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(223.983 232.681)">Establishes</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(223.983 241.661)">  exploratory, underpowered association only</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(223.983 251.881)">Does NOT establish</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(223.983 260.861)">  causation, mechanism, or an AD diagnosis</text>
   </g>
